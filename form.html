<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smoker Survey</title>
  </head>
  <body>
    <form method="get">
      <div>
        <label for="name">Siapa nama Anda? </label>
        <input type="text" id="name" name="name" placeholder="John Doe" />
      </div>
      <div>
        <label for="age">Berapa umur Anda? </label>
        <input placeholder="17" type="number" id="age" name="age" />
      </div>
      <div>
        <p>Apa jenis kelamin Anda?</p>
        <div>
          <input type="radio" id="man" name="gender" />
          <label for="man">Laki-laki</label>
        </div>
        <div>
          <input type="radio" id="woman" name="gender" />
          <label for="woman">Perempuan</label>
        </div>
      </div>
      <div>
        <p>Apakah anda perokok?</p>
        <div>
          <input type="radio" id="yessmoker" name="smoker" />
          <label for="yessmoker">Ya</label>
        </div>
        <div>
          <input type="radio" name="smoker" id="nosmoker" />
          <label for="nosmoker">Tidak</label>
        </div>
      </div>

      <div>
        <label>Jika Anda perokok, rokok apa yang pernah Anda coba?</label>

        <div>
          <input type="checkbox" id="gg" name="gg" checked />
          <label for="gg">Gudang Garam</label>
        </div>

        <div>
          <input type="checkbox" id="marlboro" name="marlboro" />
          <label for="marlboro">Marlboro</label>
        </div>

        <div>
          <input type="checkbox" id="sampoerna" name="sampoerna" />
          <label for="sampoerna">Sampoerna</label>
        </div>

        <div>
          <input type="checkbox" id="esse" name="esse" />
          <label for="esse">Esse</label>
        </div>
      </div>
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
